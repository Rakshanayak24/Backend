[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amrutam-care-api"
version = "1.0.0"
description = "Secure, observable telemedicine backend reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0", "pydantic-settings>=2.6,<3.0", "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3.0", "redis>=5.2,<6.0",
  "prometheus-client>=0.21,<1.0", "alembic>=1.14,<2.0", "cryptography>=43,<46",
  "opentelemetry-api>=1.28,<2.0", "opentelemetry-sdk>=1.28,<2.0",
  "opentelemetry-exporter-otlp>=1.28,<2.0", "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0", "bandit>=1.7,<2.0", "pip-audit>=2.7,<3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
