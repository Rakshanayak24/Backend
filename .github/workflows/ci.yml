name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - run: pytest -q
      - run: bandit -q -r app
      - run: pip-audit
      - run: python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json','w'), indent=2)"
